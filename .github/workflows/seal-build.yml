# Sealed-libraries build for neko-htmlunit 2.24.
# Upstream has no GitHub Actions CI; this mirrors the release toolchain
# recorded in the published jar's manifest (Maven 3.3.9, JDK 1.8, -source/-target 1.7)
# and runs the project's JUnit suite through Maven Surefire.
name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector; empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.3.9/apache-maven-3.3.9-bin.tar.gz
          tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      # The 2.24 release commit ships no test data: upstream committed the NekoHTML
      # test fixtures (src/test/resources) right after the release, at 05fe9d4
      # ("fix path"), which is also the revision the test classes in src/test/java
      # come from. The fixtures are CRLF / ISO-8859-1 / UTF-16 / trailing-blank
      # files whose exact bytes the canonical tests compare, which a text version
      # patch cannot carry, so lay them down byte-exact from upstream git.
      # --skip-old-files keeps any fixture the tree already provides.
      - name: Fetch upstream test fixtures
        run: |
          git fetch --no-tags --depth=1 https://github.com/HtmlUnit/htmlunit-neko.git 05fe9d43fc9331f6b0ad9a9d0b0c0e7a3ead8275
          git archive FETCH_HEAD src/test/resources | tar -x --skip-old-files -f -
          find src/test/resources -type f | wc -l

      - name: Build and test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          if [ -n "$TEST_FILTER" ]; then
            mvn -B -V -e -Dgpg.skip=true -Dtest="$TEST_FILTER" -DfailIfNoTests=false clean package
          else
            mvn -B -V -e -Dgpg.skip=true clean package
          fi

      - name: Report skipped tests
        run: |
          if grep -l "<skipped" target/surefire-reports/TEST-*.xml; then
            grep -h -B1 -A1 "<skipped" target/surefire-reports/TEST-*.xml
          else
            echo "No skipped tests reported by Surefire."
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: neko-htmlunit-jar
          path: target/neko-htmlunit-2.24.jar
          if-no-files-found: error
